# Hugo configuration file
baseURL: "https://bardo-programador.github.io/"
title: "Bardo Programador"

# Import Hextra module
module:
  imports:
    - path: github.com/imfing/hextra

# Multilingual configuration
defaultContentLanguage: pt
defaultContentLanguageInSubdir: false

languages:
  pt:
    label: "Português"
    locale: "pt-BR"
    weight: 1
    title: "Bardo Programador"
    params:
      description: "Blog pessoal e notas sobre desenvolvimento, Linux e tecnologia"
    menu:
      main:
        - name: "Blog"
          pageRef: "/blog"
          weight: 1
        - name: "Sobre"
          pageRef: "/about"
          weight: 2
        - name: "Busca"
          weight: 3
          params:
            type: search
        - name: "GitHub"
          weight: 4
          url: "https://github.com/Bardo-programador"
          params:
            icon: github
        - name: "Twitter"
          weight: 5
          url: "https://twitter.com/"
          params:
            icon: x-twitter

  en:
    label: "English"
    locale: "en-US"
    weight: 2
    title: "Bardo Programador"
    params:
      description: "Personal blog with daily notes, software development, and tech"
    menu:
      main:
        - name: "Blog"
          pageRef: "/blog"
          weight: 1
        - name: "About"
          pageRef: "/about"
          weight: 2
        - name: "Search"
          weight: 3
          params:
            type: search
        - name: "GitHub"
          weight: 4
          url: "https://github.com/Bardo-programador"
          params:
            icon: github
        - name: "Twitter"
          weight: 5
          url: "https://twitter.com/"
          params:
            icon: x-twitter

# Permalinks structure for date-based blog posts
permalinks:
  page:
    blog: /blog/:year/:month/:day/:slug/

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  # S3 Base URL (pode ser configurado para o endpoint do bucket ou CDN)
  # Exemplo: "https://meu-bucket.s3.amazonaws.com" ou "https://cdn.meudominio.com"
  s3_base_url: ""

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: false
